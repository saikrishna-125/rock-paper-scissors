<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="option-buttons">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissor">Scissors</button>
    </div>
    <div id="round-outcome">
      <div id="human-choice"></div>
      <div id="computer-choice"></div>
      <div id="outcome-text"></div>
    </div>
    <div id="score">
      <div>Your Score: <span id="human-score">0</span></div>
      <div>Computer Score: <span id="computer-score">0</span></div>
    </div>
  </body>
</html>
